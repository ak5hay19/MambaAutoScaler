apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mamba-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mamba-autoscaler

  minReplicas: 1
  maxReplicas: 20

  metrics:
    # Custom metric: predicted_replica_count exposed by Mamba predictor
    # Requires prometheus-adapter to translate this to the k8s metrics API
    - type: Pods
      pods:
        metric:
          name: predicted_replica_count
        target:
          type: AverageValue
          averageValue: "1"   # scale when recommended replicas > current

    # Fallback: also react to actual CPU (standard HPA behaviour)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
